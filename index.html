<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geocaches</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007aff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Geocaches">
<link rel="apple-touch-icon" href="./icons/pwa/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/pwa/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/pwa/favicon-16.png">
<link rel="stylesheet" href="./style.css">
<link rel="preload" href="./data.json" as="fetch" crossorigin>
</head>
<body>
<div id="view-search">
<div id="top">
  <div class="searchrow">
    <button type="button" id="menuBtn" data-i18n-aria-label="menuAria">...</button>
    <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autofocus autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <div class="statusrow">
    <button type="button" id="viewToggleBtn" data-i18n-aria-label="viewToggleAria">🗺️</button>
    <div id="count"></div>
    <button type="button" class="fieldToggleBtn" id="idToggleBtn" aria-pressed="false" data-i18n-aria-label="idToggleAria">ID</button>
    <button type="button" class="fieldToggleBtn" id="dtsToggleBtn" aria-pressed="false" data-i18n-aria-label="dtsToggleAria">D/T/S</button>
    <select id="sortSel">
      <option value="id" selected data-i18n="sortById"></option>
      <option value="name" data-i18n="sortByName"></option>
      <option value="distance" id="distOpt" disabled data-i18n="sortByDistance"></option>
    </select>
    <button type="button" id="sortDirBtn" data-i18n-aria-label="sortDirAria">⬇️</button>
  </div>
  <div class="filterrow">
    <button type="button" class="findsToggleBtn" id="hideFoundBtn" style="display:none"
            aria-pressed="false" data-i18n-aria-label="hideFoundAria">
      <span class="hidefound-icon" aria-hidden="true">🙂</span>
    </button>
    <button type="button" class="findsToggleBtn" id="hideDisabledBtn"
            aria-pressed="false" data-i18n-aria-label="hideDisabledAria">
      <span class="hidefound-icon" aria-hidden="true">⚠️</span>
    </button>
  </div>
</div>
<div id="list"></div>
<div id="mapview" style="display:none"><div id="map-canvas"></div></div>
</div>

<div id="view-menu" style="display:none">
  <div class="viewheader">
    <button type="button" class="backbtn" id="menuBackBtn" data-i18n-aria-label="backAria">‹</button>
    <div class="viewtitle" data-i18n="toolsTitle"></div>
  </div>
  <div id="menuList">
    <button type="button" class="menuitem" id="coordMenuItem" data-i18n="coordToolsItem"></button>
    <button type="button" class="menuitem" id="settingsMenuItem" data-i18n="settingsItem"></button>
  </div>
</div>

<div id="view-settings" style="display:none">
  <div class="viewheader">
    <button type="button" class="backbtn" id="settingsBackBtn" data-i18n-aria-label="backAria">‹</button>
    <div class="viewtitle" data-i18n="settingsTitle"></div>
  </div>
  <div id="settingsList">
    <button type="button" class="menuitem" id="originMenuItem" data-i18n="distanceOriginItem"></button>
    <button type="button" class="menuitem" id="dataMenuItem" data-i18n="dataItem"></button>
  </div>
  <div class="settings-body">
    <div class="settings-version" id="settingsVersion"></div>
  </div>
</div>

<div id="view-origin" style="display:none">
  <div class="viewheader">
    <button type="button" class="backbtn" id="originBackBtn" data-i18n-aria-label="backAria">‹</button>
    <div class="viewtitle" data-i18n="distanceTitle"></div>
  </div>
  <div class="settings-body">
    <label class="settings-label" for="originSel" data-i18n="distanceFromLabel"></label>
    <select id="originSel" class="settings-select">
      <option value="current" selected data-i18n="currentLocationOption"></option>
    </select>
  </div>
</div>

<div id="view-data" style="display:none">
  <div class="viewheader">
    <button type="button" class="backbtn" id="dataBackBtn" data-i18n-aria-label="backAria">‹</button>
    <div class="viewtitle" data-i18n="dataTitle"></div>
  </div>
  <div class="settings-body">
    <label class="settings-label" data-i18n="myFindsLabel"></label>
    <div id="dataStatus" class="data-status"></div>
    <input type="file" id="dataFileInput" accept="application/json,.json,.zip,application/zip" style="display:none">
    <button type="button" class="data-load-btn" id="dataLoadBtn" data-i18n="loadFindsBtn"></button>
    <div class="data-hint" data-i18n="loadFindsHint"></div>
    <div id="dataMsg" class="data-msg"></div>
  </div>
</div>

<div id="view-coord" style="display:none">
  <div class="viewheader">
    <button type="button" class="backbtn" id="coordBackBtn" data-i18n-aria-label="backAria">‹</button>
    <div class="viewtitle cc-mode-title">
      <button type="button" class="cc-mode-tab active" data-mode="converter" data-i18n="modeConverter"></button>
      <button type="button" class="cc-mode-tab" data-mode="projector" data-i18n="modeProjector"></button>
      <button type="button" class="cc-mode-tab" data-mode="circle" data-i18n="modeCircle"></button>
      <button type="button" class="cc-mode-tab" data-mode="weather" data-i18n="modeWeather"></button>
    </div>
  </div>
  <div class="cc-body">
    <div class="cc-top">
      <div class="cc-card cc-input-card">
        <div class="cc-row-label">
          <span class="cc-label-text" data-i18n="inputLabel"></span>
          <span class="cc-badge" id="cc-badge" style="display:none"></span>
          <div style="margin-left:auto;display:flex;gap:6px">
            <button type="button" class="cc-copy-btn" id="cc-paste-btn" data-i18n="pasteBtn"></button>
            <button type="button" class="cc-copy-btn" id="cc-loc-btn" style="display:none">⌖</button>
            <button type="button" class="cc-copy-btn" id="cc-clear-btn" data-i18n="clearBtn"></button>
          </div>
        </div>
        <input id="cc-inp" type="text" data-i18n-placeholder="coordInputPlaceholder"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <!-- 3rd line: empty for Converter, angle+distance for Projector, radius for Circle -->
        <div class="cc-status" id="cc-status"></div>
        <div class="cc-pair" id="cc-proj-fields" style="display:none">
          <div>
            <span class="cc-label-text" data-i18n="angleLabel"></span>
            <input id="cc-angle" type="number" inputmode="decimal" placeholder="0–360">
          </div>
          <div>
            <span class="cc-label-text" data-i18n="distanceLabel"></span>
            <input id="cc-dist" type="number" inputmode="decimal" data-i18n-placeholder="distancePlaceholder">
          </div>
        </div>
        <div class="cc-field" id="cc-circle-fields" style="display:none">
          <span class="cc-label-text" data-i18n="radiusLabel"></span>
          <input id="cc-radius" type="number" inputmode="decimal" data-i18n-placeholder="distancePlaceholder">
        </div>
      </div>

      <div class="cc-card" id="cc-output-card">
        <div class="cc-row-label">
          <div class="cc-tabs" role="tablist">
            <button type="button" class="cc-tab" data-fmt="DD">D</button>
            <button type="button" class="cc-tab active" data-fmt="DMM">DM</button>
            <button type="button" class="cc-tab" data-fmt="DMS">DMS</button>
            <button type="button" class="cc-tab" data-fmt="L-EST97">L-EST97</button>
          </div>
          <button type="button" class="cc-copy-btn" id="cc-copy-btn" data-i18n="copyBtn"></button>
          <button type="button" class="navbtn" id="cc-map-btn" disabled data-i18n="mapBtn"></button>
        </div>
        <div class="cc-output-value">
          <input id="cc-out-input" type="text" readonly>
          <div id="cc-out-dm" class="cc-dm-row"></div>
        </div>
      </div>
    </div>

    <div class="cc-address" id="cc-address" style="display:none"></div>
    <div class="cc-address-meta" id="cc-address-meta" style="display:none"></div>

    <div class="cc-map-wrap" id="cc-map-wrap">
      <div id="cc-map"></div>
    </div>

    <div class="cc-weather" id="cc-weather" style="display:none">
      <div id="wx-content"></div>
    </div>
  </div>
</div>

<div class="navbackdrop" id="navBackdrop"></div>
<div class="navmenu" id="navMenu"></div>

<script src="./i18n.js"></script>
<script src="./app.js"></script>
</body>
</html>
